<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Cover · UGC Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; background: #1a1020; }
  svg { display: block; }
  .h { font-family: "Inter Tight", sans-serif; font-weight: 300; letter-spacing: -0.035em; }
  .s { font-family: "Instrument Serif", serif; font-style: italic; }
  .m { font-family: "JetBrains Mono", monospace; font-weight: 500; letter-spacing: .16em; }
</style></head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- palette: ground plum, signal coral, light cream -->
    <radialGradient id="glow" cx="610" cy="590" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="oklch(0.42 0.12 15)" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1a1020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#f3e9dc" opacity=".09"/></pattern>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="oklch(0.62 0.16 18)"/><stop offset=".45" stop-color="oklch(0.86 0.08 40)"/><stop offset="1" stop-color="oklch(0.58 0.16 15)"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#9c7b4b"/><stop offset=".5" stop-color="#ecd7aa"/><stop offset="1" stop-color="#9c7b4b"/>
    </linearGradient>
    <!-- the product: one precise serum bottle, reused at every scale -->
    <symbol id="bottle" viewBox="0 0 100 260">
      <rect x="35" y="0" width="30" height="46" rx="14" fill="#140b18"/>
      <rect x="29" y="40" width="42" height="22" rx="3" fill="url(#gold)"/>
      <rect x="10" y="60" width="80" height="196" rx="22" fill="url(#glass)"/>
      <rect x="10" y="128" width="80" height="128" rx="22" fill="oklch(0.48 0.15 15)" opacity=".45"/>
      <rect x="19" y="74" width="7" height="160" rx="3.5" fill="#fff" opacity=".38"/>
      <rect x="24" y="150" width="52" height="58" rx="4" fill="#f6ede2" opacity=".94"/>
      <text x="50" y="183" text-anchor="middle" font-family="JetBrains Mono" font-size="9" letter-spacing="2.6" fill="#3a1d2c">LUMA</text>
      <rect x="34" y="192" width="32" height="1.4" fill="#3a1d2c" opacity=".35"/>
    </symbol>
  </defs>

  <rect width="1600" height="1000" fill="#1a1020"/>
  <rect x="820" y="0" width="780" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- headline -->
  <text x="80" y="96" class="m" font-size="13" fill="oklch(0.74 0.15 20)">PROJECT 04 · UGC AD GENERATOR</text>
  <text x="76" y="200" class="h" font-size="92" fill="#f3e9dc">One photo.</text>
  <text x="76" y="296" class="h" font-size="92" fill="#f3e9dc">A whole <tspan class="s" font-size="104" fill="oklch(0.76 0.15 22)">campaign.</tspan></text>

  <!-- hero: product on a lit plinth -->
  <circle cx="610" cy="600" r="190" fill="none" stroke="#f3e9dc" stroke-opacity=".10"/>
  <circle cx="610" cy="600" r="250" fill="none" stroke="#f3e9dc" stroke-opacity=".05"/>
  <ellipse cx="610" cy="792" rx="120" ry="14" fill="#000" opacity=".45"/>
  <use href="#bottle" x="540" y="430" width="140" height="364"/>
  <text x="80" y="790" class="m" font-size="12" fill="#f3e9dc" fill-opacity=".45">INPUT · 1 PRODUCT PHOTO</text>
  <line x1="80" y1="806" x2="300" y2="806" stroke="#f3e9dc" stroke-opacity=".2"/>

  <!-- fan of hairlines: one input, many outputs -->
  <g stroke="#f3e9dc" stroke-opacity=".18" fill="none">
    <path d="M690 600 C 780 600 800 321 900 321"/>
    <path d="M690 600 C 790 600 1010 361 1110 361"/>
    <path d="M690 600 C 800 600 1220 321 1320 321"/>
    <path d="M690 600 C 780 600 800 651 900 651"/>
    <path d="M690 600 C 790 600 1010 691 1110 691"/>
    <path d="M690 600 C 800 600 1220 651 1320 651"/>
  </g>
  <circle cx="690" cy="600" r="4" fill="oklch(0.76 0.15 22)"/>

  <!-- output: six 9:16 creatives, one system, six variations -->
  <!-- 1 cream, centred product -->
  <svg x="900" y="170" width="170" height="302" viewBox="0 0 170 302"><rect width="170" height="302" rx="14" fill="#f3e9dc"/><use href="#bottle" x="58" y="70" width="54" height="140"/><rect x="18" y="246" width="96" height="6" rx="3" fill="#3a1d2c" opacity=".75"/><rect x="18" y="260" width="64" height="6" rx="3" fill="#3a1d2c" opacity=".35"/></svg>
  <!-- 2 coral, video -->
  <svg x="1110" y="210" width="170" height="302" viewBox="0 0 170 302"><rect width="170" height="302" rx="14" fill="oklch(0.70 0.16 22)"/><use href="#bottle" x="20" y="40" width="96" height="250"/><circle cx="118" cy="120" r="24" fill="#fff" opacity=".9"/><path d="M111 108 L131 120 L111 132Z" fill="oklch(0.55 0.17 20)"/><rect x="18" y="282" width="134" height="3" rx="1.5" fill="#fff" opacity=".35"/><rect x="18" y="282" width="52" height="3" rx="1.5" fill="#fff"/></svg>
  <!-- 3 deep plum, macro crop -->
  <svg x="1320" y="170" width="170" height="302" viewBox="0 0 170 302"><rect width="170" height="302" rx="14" fill="oklch(0.30 0.07 330)"/><use href="#bottle" x="-10" y="-60" width="190" height="494"/><rect x="18" y="262" width="80" height="6" rx="3" fill="#f3e9dc" opacity=".8"/></svg>
  <!-- 4 mauve, pair -->
  <svg x="900" y="500" width="170" height="302" viewBox="0 0 170 302"><rect width="170" height="302" rx="14" fill="oklch(0.52 0.10 340)"/><use href="#bottle" x="30" y="84" width="50" height="130"/><use href="#bottle" x="88" y="104" width="42" height="110" opacity=".75"/><rect x="18" y="246" width="110" height="6" rx="3" fill="#f3e9dc" opacity=".85"/><rect x="18" y="260" width="70" height="6" rx="3" fill="#f3e9dc" opacity=".4"/></svg>
  <!-- 5 cream, video with sound -->
  <svg x="1110" y="540" width="170" height="302" viewBox="0 0 170 302"><rect width="170" height="302" rx="14" fill="oklch(0.88 0.05 55)"/><use href="#bottle" x="56" y="58" width="58" height="150"/><g fill="oklch(0.55 0.17 20)"><rect x="18" y="246" width="4" height="12" rx="2"/><rect x="26" y="240" width="4" height="24" rx="2"/><rect x="34" y="244" width="4" height="16" rx="2"/><rect x="42" y="236" width="4" height="32" rx="2"/><rect x="50" y="243" width="4" height="18" rx="2"/><rect x="58" y="247" width="4" height="10" rx="2"/></g><text x="152" y="257" text-anchor="end" font-family="JetBrains Mono" font-size="9" letter-spacing="1.5" fill="#3a1d2c" opacity=".6">AUDIO</text></svg>
  <!-- 6 coral-deep, still -->
  <svg x="1320" y="500" width="170" height="302" viewBox="0 0 170 302"><rect width="170" height="302" rx="14" fill="oklch(0.42 0.13 15)"/><circle cx="85" cy="140" r="64" fill="oklch(0.70 0.16 22)" opacity=".5"/><use href="#bottle" x="60" y="68" width="50" height="130"/><rect x="18" y="246" width="90" height="6" rx="3" fill="#f3e9dc" opacity=".85"/><rect x="18" y="260" width="56" height="6" rx="3" fill="#f3e9dc" opacity=".4"/></svg>
  <text x="900" y="136" class="m" font-size="12" fill="#f3e9dc" fill-opacity=".45">OUTPUT · IMAGES + VIDEOS</text>

  <!-- process notation (shared across all covers) -->
  <line x1="80" y1="900" x2="1520" y2="900" stroke="#f3e9dc" stroke-opacity=".16"/>
  <g class="m" font-size="12" fill="#f3e9dc">
    <circle cx="80" cy="900" r="5" fill="oklch(0.76 0.15 22)"/><text x="98" y="904" fill-opacity=".8">01 ANALYZE</text>
    <circle cx="340" cy="900" r="5" fill="#1a1020" stroke="oklch(0.76 0.15 22)" stroke-width="1.5"/><text x="358" y="904" fill-opacity=".8">02 RESEARCH TRENDS</text>
    <circle cx="660" cy="900" r="5" fill="#1a1020" stroke="oklch(0.76 0.15 22)" stroke-width="1.5"/><text x="678" y="904" fill-opacity=".8">03 WRITE PROMPTS</text>
    <circle cx="960" cy="900" r="5" fill="oklch(0.76 0.15 22)"/><text x="978" y="904" fill-opacity=".8">04 GENERATE</text>
    <text x="1520" y="904" text-anchor="end" fill-opacity=".4">NANO BANANA 2 · VEO 3.1</text>
  </g>
</svg>
</body></html>
